<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Family Command Center</title>

    <!-- FullCalendar & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <link href="https://fonts.cdnfonts.com/css/sacramento" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/amatica-sc?styles=50347" rel="stylesheet">

    <style>
        :root {
            --fc-page-bg-color: transparent;
            --fc-today-bg-color: #B1E1D8;
            --fc-event-text-color: #183D1E;
            --primary-dark: #183D1E;
            --mint-bg: rgba(222, 242, 238, 0.92);
            --card-border: #183D1E;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Amatica SC', sans-serif;
            font-size: 26px;
            color: var(--primary-dark);
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrollbars on fixed wall displays */
        }

        /* Top Header / Live Date Display */
        header {
            margin-bottom: 15px;
            padding: 0 10px;
            text-align: center;
        }

        .date-display {
            font-family: 'Sacramento', cursive;
            font-size: 60px;
            font-weight: bold;
            color: var(--primary-dark);
            text-shadow: 1px 1px 4px rgba(255, 255, 255, 0.8);
        }

        /* Widescreen Island Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        .card {
            background: var(--mint-bg);
            border: 3px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(5px);
        }

        /* Hide the day heading (e.g., "Saturday") in listDay views */
        .fc-list-day {
            display: none !important;
        }

        /* Remove the background tint and borders from the list table container */
        .fc-list, .fc-list-table, .fc-list-stage, .fc-scroller {
            background: transparent !important;
            border: none !important;
        }

        /* Remove row backgrounds and borders for individual events */
        .fc-list-item {
            background: transparent !important;
            border: none !important;
        }

        .fc-list-item td {
            background: transparent !important;
            border-color: rgba(24, 61, 30, 0.15) !important;
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-family: 'Sacramento', cursive;
            font-size: 38px;
            text-align: center;
            border-bottom: 2px solid rgba(24, 61, 30, 0.2);
            padding-bottom: 4px;
        }

        /* Island Mapping */
        .card-today {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
        }

        .card-chores {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .card-weather {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            text-align: center;
        }

        .card-tasks {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .card-menu {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        .card-upcoming {
            grid-column: 1 / 4;
            grid-row: 3 / 4;
            margin-top: 5px;
        }
        
        /* Task & Chore Lists: Two Columns */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            
            /* Remove flex layout here so multi-columns work properly */
            display: block; 
            columns: 2; 
            column-gap: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 32px;
            
            /* Prevents individual items from getting awkwardly split across columns */
            break-inside: avoid; 
            -webkit-column-break-inside: avoid;
        }
        .task-item::before {
            content: "•";
            color: var(--primary-dark);
            font-size: 35px;
            margin-right: 10px;
        }

        /* FullCalendar Clean Overrides */
        .fc {
            font-family: 'Amatica SC', sans-serif;
        }
        .fc-list-event-title, .fc-event-title {
            font-size: 32px;
        }
        .fc-list-day-cushion {
            background-color: rgba(24, 61, 30, 0.1) !important;
        }
        /* Hide time, dots, and borders specifically for the Menu card */
        #calendar-menu .fc-list-event-time,
        #calendar-menu .fc-list-event-dot {
            display: none !important;
        }
        #calendar-menu .fc-list-item td {
            border: none !important;
            padding-left: 0 !important;
        }

        #calendar-menu .fc-list-table {
            border: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="date-display" id="live-date">Friday, August 7 ♡</div>
    </header>

    <div class="dashboard-grid">
        <!-- Top-Left: Today's Schedule Only -->
        <div class="card card-today">
            <h2>Today's Schedule</h2>
            <div id="calendar-today"></div>
        </div>

        <!-- Top-Right: Weather -->
        <div class="card card-weather">
            <h2>Weather</h2>
            <div id="weather-widget">
                <p>Loading Weather...</p>
            </div>
        </div>

        <!-- Middle-Center: Chores -->
        <div class="card card-chores">
            <h2>Today's Chores</h2>
            <ul class="task-list" id="chores-list">
                <li class="task-item">Loading chores...</li>
            </ul>
        </div>

        <!-- Middle-Right: To Do -->
        <div class="card card-tasks">
            <h2>To Do</h2>
            <ul class="task-list" id="todo-list">
                <li class="task-item">Loading tasks...</li>
            </ul>
        </div>

        <!-- Bottom-Right: Menu -->
        <div class="card card-menu">
            <h2>Tonight's Menu</h2>
            <div id="calendar-menu"></div>
        </div>

        <!-- Full-Width Bottom Strip: Next 7 Days -->
        <div class="card card-upcoming">
            <h2>Upcoming This Week</h2>
            <div id="calendar-upcoming"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Live Date Header
            function updateDate() {
                const now = new Date();
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                document.getElementById('live-date').innerText = 
                    now.toLocaleDateString('en-US', options) + " ♡";
            }
            updateDate();

            // Weather API Call
            const weatherApiKey = 'd30ad5698b761df2e8aa71f1cd86a4ce';
            const lat = '43.4918'; 
            const lon = '-116.4201'; 

            Promise.all([
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${weatherApiKey}`).then(res => res.json()),
                fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${weatherApiKey}`).then(res => res.json())
            ])
            .then(([weatherData, airData]) => {
                const iconCode = weatherData.weather[0].icon;
                const aqiLevels = ["Good", "Fair", "Moderate", "Poor", "Very Poor"];
                const aqiText = aqiLevels[airData.list[0].main.aqi - 1] || "Unknown";

                document.getElementById('weather-widget').innerHTML = `
                    <div style="font-size: 50px; font-weight: bold; line-height: 1.1; margin-top: 5px;">
                        ${Math.round(weatherData.main.temp)}°F
                    </div>
                    <div style="font-size: 24px; text-transform: capitalize; margin-top: 2px;">
                        ${weatherData.weather[0].description}
                    </div>
                    <div style="font-size: 18px; opacity: 0.85; margin-top: 6px;">
                        Humidity: ${weatherData.main.humidity}% | Wind: ${Math.round(weatherData.wind.speed)} mph
                    </div>
                    <div style="font-size: 18px; opacity: 0.85; margin-top: 2px;">
                        Air Quality: <strong>${aqiText}</strong>
                    </div>
                `;
            })
            .catch(err => {
                document.getElementById('weather-widget').innerHTML = '<p>Weather unavailable</p>';
                console.log('Weather fetch error:', err);
            });

            // Your Google Apps Script Web App URL
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxTiZjej-RA7nje7-UnxUNDtZ_uexou-c56DQ10sFKZQHmU0VrK5u2QhDvvTwCoRmCq/exec';

            const familyEventSources = [
                { url: `${webAppUrl}?type=calendar&calId=1cb9bcf8bd82c7503ec7f910d83ff2d06aa9ed95580e97d8b0aae5ec50af3e9c@group.calendar.google.com&color=%23183D1E` },
                { url: `${webAppUrl}?type=calendar&calId=e64b6e6c456bc5349128cf1ab464feadb466099291938151f50f6d77d5864ed2@group.calendar.google.com&color=%23FF7C80` },
                { url: `${webAppUrl}?type=calendar&calId=b758d003d52ad4a9d09f96056c7dcc3d7cbe82e628a53cd206286010c51c03af@group.calendar.google.com&color=%23FFCCCC` },
                { url: `${webAppUrl}?type=calendar&calId=a12d8095704a134b2d4b79fb45f027046ccf06e243eb73118c400c7e370aafc5@group.calendar.google.com&color=%2365A0A6` }
            ];

            const menuEventSources = [
                { url: `${webAppUrl}?type=calendar&calId=45ed446ae1f6ade64289ae9e489fb2cc607ec8c88e8872abe765f040b3312e6c@group.calendar.google.com&color=%23183D1E` },
            ];

            // 2. TODAY'S SCHEDULE
            var calElToday = document.getElementById('calendar-today');
            var calToday = new FullCalendar.Calendar(calElToday, {
                initialView: 'listDay',
                headerToolbar: false,
                height: "auto",
                eventSources: familyEventSources
            });
            calToday.render();

            // 3. UPCOMING THIS WEEK (Fixed view name to 'dayGridWeek')
            var calElUpcoming = document.getElementById('calendar-upcoming');
            var calUpcoming = new FullCalendar.Calendar(calElUpcoming, {
                initialView: 'dayGridWeek',
                duration: { days: 7 },
                headerToolbar: false,
                height: "auto",
                eventSources: familyEventSources
            });
            calUpcoming.render();

            // 4. TODAY'S MENU (Fixed unique variable names: calElMenu & calMenu)
            var calElMenu = document.getElementById('calendar-menu');
            var calMenu = new FullCalendar.Calendar(calElMenu, {
                initialView: 'listDay',
                headerToolbar: false,
                height: "auto",
                eventSources: menuEventSources
            });
            calMenu.render();

            // 5. Fetch Tasks & Chores from Apps Script Web App
            fetch(`${webAppUrl}?type=tasks`)
                .then(response => response.json())
                .then(data => {
                    renderTasks('chores-list', data.chores);
                    renderTasks('todo-list', data.tasks);
                })
                .catch(err => console.log('Tasks not loaded yet:', err));

            // Helper function to render lists and limit them
            function renderTasks(elementId, items) {
                const listElement = document.getElementById(elementId);
                if (!items || items.length === 0) {
                    listElement.innerHTML = '<li class="task-item">All done!</li>';
                    return;
                }

                const limitedItems = items.slice(0, 8);
                
                let html = '';
                limitedItems.forEach(task => {
                    const taskText = typeof task === 'object' && task !== null 
                        ? (task.title || task.name || task.content || task.text || JSON.stringify(task)) 
                        : task;
                        
                    html += `<li class="task-item">${taskText}</li>`;
                });
                listElement.innerHTML = html;
            }
        });
    </script>
</body>
</html>
