<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Family Command Center</title>

    <!-- FullCalendar & Fonts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <link href="https://fonts.cdnfonts.com/css/sacramento" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/amatica-sc?styles=50347" rel="stylesheet">

    <style>
        :root {
            --fc-page-bg-color: transparent;
            --fc-today-bg-color: #B1E1D8;
            --fc-event-text-color: #183D1E;
            --primary-dark: #183D1E;
            --mint-bg: rgba(222, 242, 238, 0.92);
            --card-border: #183D1E;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 5px 5px 10px 5px;
            font-family: 'Amatica SC', sans-serif;
            font-size: 26px;
            color: var(--primary-dark);
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrollbars on fixed wall displays */

            /* Perfect Scaling Setup */
            transform: scale(0.46);
            transform-origin: top left;
            width: 217.4%; 
            height: 217.4%;
        }

        /* Top Header / Live Date Display */
        header {
            margin-bottom: 10px;
            padding: 0;
            text-align: center;
        }

        .date-display {
            font-family: 'Sacramento', cursive;
            font-size: 60px;
            font-weight: bold;
            color: var(--primary-dark);
            text-shadow: 1px 1px 4px rgba(255, 255, 255, 0.8);
        }

        /* Widescreen Island Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 10px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: var(--mint-bg);
            border: 3px solid var(--card-border);
            border-radius: 20px;
            padding: 8px 18px 18px 18px; /* Tighter top padding */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(5px);
        }

        /* Hide the day heading (e.g., "Saturday") in listDay views */
        .fc-list-day {
            display: none !important;
        }

        /* Remove the background tint and borders from the list table container */
        .fc-list, .fc-list-table, .fc-list-stage, .fc-scroller {
            background: transparent !important;
            border: none !important;
        }

        /* Remove row backgrounds and borders for individual events */
        .fc-list-item {
            background: transparent !important;
            border: none !important;
        }

        .fc-list-item td {
            background: transparent !important;
            border-color: rgba(24, 61, 30, 0.15) !important;
        }

        .card h2 {
            margin: 0 0 8px 0;
            padding-top: 0;
            font-family: 'Sacramento', cursive;
            font-size: 38px;
            text-align: center;
            border-bottom: 2px solid rgba(24, 61, 30, 0.2);
            padding-bottom: 4px;
        }

        /* Island Mapping */
        .card-today {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
        }

        /* Increase size for Today's Schedule events */
        #calendar-today .fc-list-event-title, 
        #calendar-today .fc-list-event-time {
            font-size: 70px !important; 
            letter-spacing: -2px !important;
            padding-right: 15px !important;
            white-space: nowrap !important;
        }

        #calendar-today .fc-list-event-time .fc-list-event-time-text {
            margin: 0 !important;
        }

        #calendar-today .fc-list-item {
            font-size: 70px !important;
        }

        /* Force FullCalendar list table cells to vertically center */
        #calendar-today .fc-list-item td {
            vertical-align: middle !important;
        }

        /* Center the event dot graphic specifically */
        #calendar-today .fc-list-event-graphic {
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            vertical-align: middle !important;
        }

        .card-chores {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        .card-weather {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            text-align: center;
            padding: 13px 18px !important;
        }

        /* Two-Column Weather Card Layout */
        .weather-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            min-height: 125px;
        }

        .weather-temp {
            font-size: 125px;
            font-weight: bold;
            line-height: 1;
        }

        .weather-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 35px;
            line-height: 1.25;
            text-transform: capitalize;
        }

        /* Increase size for Tonight's Menu */
        #calendar-menu .fc-list-event-title, 
        #calendar-menu .fc-list-item {
            font-size: 40px !important; 
        }

        .card-tasks {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .card-menu {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        .card-upcoming {
            grid-column: 1 / 4;
            grid-row: 3 / 4;
            margin-top: 5px;
        }
        
        /* Task & Chore Lists: Two Columns */
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: block; 
            columns: 2; 
            column-gap: 5px;
        }

        .chores-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: block;
            columns: 1;
        }

        .task-item {
            display: flex;
            align-items: center;
            margin-bottom: 0px;
            font-size: 32px;
            break-inside: avoid; 
            -webkit-column-break-inside: avoid;
        }
        .task-item::before {
            content: "•";
            color: var(--primary-dark);
            font-size: 35px;
            margin-right: 10px;
        }

        /* FullCalendar Clean Overrides */
        .fc {
            font-family: 'Amatica SC', sans-serif;
        }
        .fc-list-event-title, .fc-event-title {
            font-size: 32px;
        }
        .fc-list-day-cushion {
            background-color: rgba(24, 61, 30, 0.1) !important;
        }
        
        #calendar-menu .fc-list-event-time,
        #calendar-menu .fc-list-event-dot {
            display: none !important;
        }
        #calendar-menu .fc-list-item td {
            border: none !important;
            padding-left: 0 !important;
        }
        #calendar-menu .fc-list-table {
            border: none !important;
        }

        /* Upcoming Week Layout & Stacking */
        .card-upcoming .fc, 
        .card-upcoming .fc-view-harness, 
        .card-upcoming .fc-daygrid-body, 
        .card-upcoming table {
            width: 100% !important;
        }

        .card-upcoming .fc-col-header, 
        .card-upcoming .fc-scrollgrid-sync-table {
            width: 100% !important;
            table-layout: fixed !important;
        }

        .card-upcoming .fc-daygrid-event-harness {
            position: relative !important;
            margin-bottom: 2px !important;
        }

        .card-upcoming .fc-daygrid-day-events {
            position: relative !important;
            display: flex !important;
            flex-direction: column !important;
        }

/* Allow multi-line wrapping and align the dot with the first line of text */
        .card-upcoming .fc-daygrid-event {
            display: flex !important;
            align-items: flex-start !important; 
            white-space: normal !important;
        }

        .card-upcoming .fc-daygrid-event-dot {
            margin-top: 6px !important; /* Adjust this slightly up or down to align with the first text line */
            flex-shrink: 0;
        }

        .card-upcoming .fc-event-main {
            white-space: normal !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="date-display" id="live-date">Friday, August 7 ♡</div>
    </header>

    <div class="dashboard-grid">
        <!-- Top-Left: Today's Schedule Only -->
        <div class="card card-today">
            <h2>Today's Schedule</h2>
            <div id="calendar-today"></div>
        </div>

        <!-- Top-Right: Weather -->
        <div class="card card-weather">
            <h2>Weather</h2>
            <div id="weather-widget">
                <p>Loading Weather...</p>
            </div>
        </div>

        <!-- Middle-Center: Chores -->
        <div class="card card-chores">
            <h2>Today's Chores</h2>
            <ul class="chores-list" id="chores-list">
                <li class="task-item">Loading chores...</li>
            </ul>
        </div>

        <!-- Middle-Right: To Do -->
        <div class="card card-tasks">
            <h2>To Do</h2>
            <ul class="task-list" id="todo-list">
                <li class="task-item">Loading tasks...</li>
            </ul>
        </div>

        <!-- Bottom-Right: Menu -->
        <div class="card card-menu">
            <h2>Tonight's Menu</h2>
            <div id="calendar-menu"></div>
        </div>

        <!-- Full-Width Bottom Strip: Next 7 Days -->
        <div class="card card-upcoming">
            <h2>Upcoming This Week</h2>
            <div id="calendar-upcoming"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Live Date Header
            function updateDate() {
                const now = new Date();
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                document.getElementById('live-date').innerText = 
                    now.toLocaleDateString('en-US', options) + " ♡";
            }
            updateDate();

            // Weather & Air Quality API Calls (OpenWeather + Open-Meteo US AQI)
            const weatherApiKey = 'd30ad5698b761df2e8aa71f1cd86a4ce';
            const lat = '43.4918'; 
            const lon = '-116.4201'; 

            // Weather & Air Quality Function (Updates silently in the background)
        const weatherApiKey = 'd30ad5698b761df2e8aa71f1cd86a4ce';
        const lat = '43.4918'; 
        const lon = '-116.4201'; 

        function updateWeather() {
            Promise.all([
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${weatherApiKey}`).then(res => res.json()),
                fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`).then(res => res.json())
            ])
            .then(([weatherData, aqiData]) => {
                const usAqi = aqiData.current ? aqiData.current.us_aqi : "N/A";

                document.getElementById('weather-widget').innerHTML = `
                    <div class="weather-container">
                        <div class="weather-temp">${Math.round(weatherData.main.temp)}°F</div>
                        <div class="weather-details">
                            <div>${weatherData.weather[0].description}</div>
                            <div>Humidity: ${weatherData.main.humidity}%</div>
                            <div>Wind: ${Math.round(weatherData.wind.speed)} mph | AQI: ${usAqi}</div>
                        </div>
                    </div>
                `;
            })
            .catch(err => {
                console.log('Weather/AQI fetch error:', err);
                // Keeps displaying the last known temperature instead of showing an error message
            });
        }

        // Run weather fetch immediately on load
        updateWeather();
            // Your Google Apps Script Web App URL
            const webAppUrl = 'https://script.google.com/macros/s/AKfycbxTiZjej-RA7nje7-UnxUNDtZ_uexou-c56DQ10sFKZQHmU0VrK5u2QhDvvTwCoRmCq/exec';

            const familyEventSources = [
                //Marie
                { url: `${webAppUrl}?type=calendar&calId=1cb9bcf8bd82c7503ec7f910d83ff2d06aa9ed95580e97d8b0aae5ec50af3e9c@group.calendar.google.com&color=%23183D1E` },
                { url: `${webAppUrl}?type=calendar&calId=mariedtharp@gmail.com&color=%23e9905a` },
                //David
                { url: `${webAppUrl}?type=calendar&calId=mrdavidrobison@gmail.com&color=%23c7cdd6` },
                //Charlotte
                { url: `${webAppUrl}?type=calendar&calId=e64b6e6c456bc5349128cf1ab464feadb466099291938151f50f6d77d5864ed2@group.calendar.google.com&color=%23FF7C80` },
                //Esther
                { url: `${webAppUrl}?type=calendar&calId=b758d003d52ad4a9d09f96056c7dcc3d7cbe82e628a53cd206286010c51c03af@group.calendar.google.com&color=%23a8469b` },
                //William
                { url: `${webAppUrl}?type=calendar&calId=a12d8095704a134b2d4b79fb45f027046ccf06e243eb73118c400c7e370aafc5@group.calendar.google.com&color=%2365A0A6` }
            ];

            const menuEventSources = [
                { url: `${webAppUrl}?type=calendar&calId=45ed446ae1f6ade64289ae9e489fb2cc607ec8c88e8872abe765f040b3312e6c@group.calendar.google.com&color=%23183D1E` },
            ];

            // 2. TODAY'S SCHEDULE (With clean time format)
            var calElToday = document.getElementById('calendar-today');
            var calToday = new FullCalendar.Calendar(calElToday, {
                initialView: 'listDay',
                headerToolbar: false,
                height: "auto",
                eventSources: familyEventSources,
                eventTimeFormat: {
                    hour: 'numeric',
                    minute: '2-digit',
                    omitZeroMinute: true,
                    meridiem: false
                }
            });
            calToday.render();

            // 3. UPCOMING THIS WEEK
            var calElUpcoming = document.getElementById('calendar-upcoming');
            var calUpcoming = new FullCalendar.Calendar(calElUpcoming, {
                initialView: 'dayGridWeek',
                duration: { days: 7 },
                headerToolbar: false,
                height: "auto",
                dayMaxEvents: false,
                fixedWeekCount: false,
                eventSources: familyEventSources
            });
            calUpcoming.render();

            // 4. TODAY'S MENU
            var calElMenu = document.getElementById('calendar-menu');
            var calMenu = new FullCalendar.Calendar(calElMenu, {
                initialView: 'listDay',
                headerToolbar: false,
                height: "auto",
                eventSources: menuEventSources
            });
            calMenu.render();

            // 5. Fetch Tasks & Chores from Apps Script Web App
            fetch(`${webAppUrl}?type=tasks`)
                .then(response => response.json())
                .then(data => {
                    renderTasks('chores-list', data.chores);
                    renderTasks('todo-list', data.tasks);
                })
                .catch(err => console.log('Tasks not loaded yet:', err));

            // Helper function to render lists and limit them
            function renderTasks(elementId, items) {
                const listElement = document.getElementById(elementId);
                if (!items || items.length === 0) {
                    listElement.innerHTML = '<li class="task-item">All done!</li>';
                    return;
                }

                const limitedItems = items.slice(0, 8);
                
                let html = '';
                limitedItems.forEach(task => {
                    const taskText = typeof task === 'object' && task !== null 
                        ? (task.title || task.name || task.content || task.text || JSON.stringify(task)) 
                        : task;
                        
                    html += `<li class="task-item">${taskText}</li>`;
                });
                listElement.innerHTML = html;
            }

            // Background Auto-Refresh every 5 minutes (300,000 milliseconds)
        setInterval(function() {
            // 1. Refresh Weather & AQI
            updateWeather();

            // 2. Refresh Tasks & Chores
            fetch(`${webAppUrl}?type=tasks`)
                .then(response => response.json())
                .then(data => {
                    renderTasks('chores-list', data.chores);
                    renderTasks('todo-list', data.tasks);
                })
                .catch(err => console.log('Background task refresh failed:', err));

            // 3. Refresh Calendars
            if (typeof calToday !== 'undefined') calToday.refetchEvents();
            if (typeof calUpcoming !== 'undefined') calUpcoming.refetchEvents();
            if (typeof calMenu !== 'undefined') calMenu.refetchEvents();
        }, 300000);
        });
    </script>
</body>
</html>
